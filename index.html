<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Three Wars Timeline</title>
  <link rel="stylesheet" href="https://cdn.knightlab.com/libs/timeline3/latest/css/timeline.css">
  <style>
    html, body { height: 100%; margin: 0; padding: 0; background: #f4f1ea; }
    #timeline-embed { width: 100%; height: 100vh; }
  </style>
</head>
<body>
  <div id="timeline-embed"></div>
  <script src="https://cdn.knightlab.com/libs/timeline3/latest/js/timeline.js"></script>
  <script>
    window.timeline = new TL.Timeline('timeline-embed', 'timeline.json', {
      hash_bookmark: true,
      initial_zoom: 2,
      timenav_height_percentage: 30
    });
  </script>
</body>
</html>
